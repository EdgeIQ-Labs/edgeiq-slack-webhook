display_information:
  name: EdgeIQ Security Scanner
  description: Automated security scanning for your Slack workspace
  background_color: "#0b0f14"
features:
  bot_user:
    display_name: EdgeIQ Scanner
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
